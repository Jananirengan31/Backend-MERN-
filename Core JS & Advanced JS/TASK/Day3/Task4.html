<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
</head>
<body>
    <script>
        const student = {
    name: "Bala",
    age: 25,
    course: "JavaScript",
    city: "Chennai"
};

const printStudent = ({ name, age, course, city }) => {
    console.log(`Student: ${name}`);
    console.log(`Age: ${age}`);
    console.log(`Course: ${course}`);
    console.log(`City: ${city}`);
};

printStudent(student);
    </script>
</body>
</html>
