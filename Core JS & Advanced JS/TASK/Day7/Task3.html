
<script>

let price = 5000;

let discount = new Promise((resolve, reject) => {

    if (price <= 0) {
        reject("Invalid Product Price");
    }
    else {
        let discountedPrice = price - (price * 10 / 100);
        resolve(discountedPrice);
    }

});

discount
.then((result) => {
    console.log("Discounted Price:", result);
})
.catch((error) => {
    console.log(error);
})
.finally(() => {
    console.log("Calculation Completed");
});

</script>
