
<script>

let username = "admin";
let password = "1234";

let login = new Promise((resolve, reject) => {

    setTimeout(() => {

        if (username == "admin" && password == "1234") {
            resolve("Login Successful");
        }
        else {
            reject("Invalid Credentials");
        }

    }, 2000);

});

login
.then((message) => {
    console.log(message);
})
.catch((error) => {
    console.log(error);
});

</script>
