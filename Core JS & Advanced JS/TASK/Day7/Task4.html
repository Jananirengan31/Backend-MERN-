
<script>

fetch("https://jsonplaceholder.typicode.com/users")

.then((response) => {

    if (!response.ok) {
        throw new Error("Something went wrong");
    }

    return response.json();

})

.then((users) => {

    users.forEach((user) => {
        console.log(user.name);
    });

})

.catch((error) => {
    console.log("Error:", error.message);
});

</script>
